name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: hikae-2vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Verify the configured client routing identity
        env:
          CLIENT_BOT_LOGIN: ${{ vars.CLIENT_BOT_LOGIN }}
        run: |
          node --input-type=module -e "import {strict as assert} from 'node:assert'; import {config} from './src/core.mjs'; assert.equal(process.env.CLIENT_BOT_LOGIN, config.client_app + '[bot]');"
      - run: npm test
      - name: Verify Agentic Workflow lockfiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw --pin v1.0.1
          bash scripts/compile-agentic.sh --check
  deploy:
    environment: selfheal-server
    needs: check
    if: github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: hikae-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.SERVER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy webhook and queue consumer
        env:
          FUNCTION_PREFIX: ${{ vars.FUNCTION_PREFIX }}
        run: |
          set -euo pipefail
          zip /tmp/selfheal.zip src/*.mjs src/config.json
          for function in webhook dispatch; do
            aws lambda update-function-code --function-name "${FUNCTION_PREFIX}-$function" \
              --zip-file fileb:///tmp/selfheal.zip --publish --query Version --output text
            aws lambda wait function-updated --function-name "${FUNCTION_PREFIX}-$function"
          done
      - name: Verify service health
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
        run: |
          test -n "$WEBHOOK_URL"
          curl --fail --silent --show-error "$WEBHOOK_URL/health"
